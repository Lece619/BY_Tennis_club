<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BY 테니스">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>BY 테니스 클럽</title>
<style>
  :root{
    --bg:#f6f4f4; --card:#ffffff; --text:#2a1d1e; --muted:#7a6b6c; --line:#e6dddd;
    --accent:#b3141c; --accent-soft:#fbe9ea; --danger:#7a7a7a; --regular:#3b6fd8; --flash:#e08a1e;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
  .top{position:sticky;top:0;z-index:5}
  header{background:linear-gradient(135deg,#c8161f,#8e0f16);box-shadow:0 2px 10px rgba(120,0,10,.25);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:8px}
  header h1{margin:0;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:10px}
  header h1 img{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:cover}
  .chip{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;max-width:150px}
  .chip img{width:22px;height:22px;border-radius:50%;margin-right:6px;object-fit:cover;background:#fff;flex:none}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .avatar-lg{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#eee;flex:none}
  button.kakao{width:100%;background:#FEE500;color:#191919;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
  .person .x{margin-left:6px;cursor:pointer;opacity:.55;font-weight:700}
  .person .x:hover{opacity:1}
  .member{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .member:first-child{border-top:none}
  .member img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#eee;flex:none}
  .member .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .adminBadge{font-size:11px;background:#fff3cd;color:#6b4e00;border-radius:4px;padding:2px 6px;margin-left:4px;vertical-align:middle;font-weight:600}
  main{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(42,29,30,.05)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  button.primary{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(179,20,28,.3)}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
  button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
  button.icon{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--text);padding:4px 10px}
  button.primary,button.ghost,button.danger{min-height:40px;touch-action:manipulation}
  button:disabled{opacity:.5;cursor:default}
  .muted{color:var(--muted);font-size:13px}
  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head strong{font-size:17px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
  .cal .day{min-height:58px;border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;background:var(--card);display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cal .day.other{opacity:.35}
  .cal .day.today .n{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center}
  .cal .day.selected{background:var(--accent-soft);border-color:var(--accent)}
  .cal .day .n{font-size:12px;font-weight:600}
  .cal .day .n.sun{color:var(--danger)}
  .cal .day .n.sat{color:var(--regular)}
  .cal .tag{font-size:10px;border-radius:4px;padding:1px 4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag.regular{background:var(--regular)} .tag.flash{background:var(--flash)}
  .badge{display:inline-block;font-size:11px;border-radius:4px;padding:2px 6px;color:#fff;margin-right:6px;vertical-align:middle}
  .badge.regular{background:var(--regular)} .badge.flash{background:var(--flash)}
  .item{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
  .item:first-of-type{border-top:none}
  .item .title{font-weight:600;font-size:15px}
  .item:active{opacity:.7}
  .info{margin-top:10px;display:grid;gap:6px}
  .info>div{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
  .info span{color:var(--muted);font-size:13px;padding-top:1px}
  .info b{font-weight:600}
  /* participants */
  .people{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .person{background:var(--accent-soft);color:#8e0f16;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
  .person.me{background:var(--accent);color:#fff}
  /* bracket */
  .round{margin-top:10px}
  .round h4{margin:8px 0 6px;font-size:14px;color:var(--muted);letter-spacing:.02em}
  .match{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;font-size:14px}
  .match .team{text-align:center}
  .match .score{display:flex;align-items:center;gap:4px}
  .match input{width:40px;text-align:center;font-size:15px;padding:4px;border:1px solid var(--line);border-radius:6px}
  .match.done{background:#fff8f0;border-color:#f3d9b1}
  .rest{font-size:13px;color:var(--muted)}
  /* form */
  label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
  input,select,textarea{width:100%;font-size:15px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
  textarea{min-height:60px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:92vh;overflow:auto}
  @media(min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
  .banner{background:#fff3cd;border:1px solid #ffe08a;color:#6b4e00;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
  .banner code{background:#fff;padding:1px 4px;border-radius:4px}
  .hidden{display:none !important}
  /* tabs */
  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:none;padding:11px 0;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
  /* home */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 4px rgba(42,29,30,.05)}
  .tile b{display:block;font-size:22px;color:var(--accent)}
  .tile span{font-size:12px;color:var(--muted)}
  .up{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
  .up:first-child{border-top:none}
  .up .d{min-width:44px;text-align:center;background:var(--accent-soft);color:#8e0f16;border-radius:10px;padding:6px 4px;line-height:1.15}
  .up .d b{display:block;font-size:18px}
  .up .d small{font-size:11px}
  .up .t{flex:1;min-width:0}
  .up .t .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up .joined{font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:3px 8px;white-space:nowrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:none;border:none;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--muted)}
  .seg button.active{background:var(--accent);color:#fff;font-weight:600}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  table.st{width:100%;border-collapse:collapse;font-size:14px}
  table.st th{text-align:center;font-weight:500}
  table.st th:first-child{text-align:left}
  table.st td{padding:4px 0;border-top:1px solid var(--line);text-align:center}
  table.st td:first-child{text-align:left}
  /* 좁은 화면(폰) */
  @media(max-width:480px){
    main{padding:12px}
    .card{padding:12px}
    .cal{gap:3px}
    .cal .day{min-height:52px;padding:3px;gap:3px}
    .cal .tag{font-size:0;height:6px;padding:0;border-radius:3px}   /* 제목 대신 색 막대 */
    .match{grid-template-columns:1fr;gap:4px;text-align:center}
    .match .score{justify-content:center}
    .match input{width:48px;font-size:16px}
    input,select,textarea{font-size:16px}   /* iOS 자동 확대 방지 */
  }
</style>
</head>
<body>
<div class="top">
<header>
  <h1 onclick="showView('home')"><img src="icon-192.png" alt="" onerror="this.remove()"><span id="clubName">BY 테니스 클럽</span></h1>
  <div>
    <button class="chip" id="userChip" onclick="openProfile()"><span>로그인</span></button>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-view="home" onclick="showView('home')">홈</button>
  <button data-view="calendar" onclick="showView('calendar')">달력</button>
</nav>
</div>

<main>
  <div id="banner" class="banner hidden"></div>

  <!-- 홈 대시보드 -->
  <section id="viewHome" class="hidden">
    <div class="tiles" id="tiles"></div>
    <div class="card">
      <div class="row"><strong>다가오는 모임</strong><button class="primary" onclick="openCreate()">+ 모임 만들기</button></div>
      <div id="upcoming" style="margin-top:6px"></div>
    </div>
    <div class="card">
      <strong>지난 모임</strong>
      <div id="recent" style="margin-top:6px"></div>
    </div>
    <div class="card hidden" id="adminCard">
      <strong>회원 관리 <span class="adminBadge">운영진</span></strong>
      <div class="muted">운영진 지정과 해제를 할 수 있습니다.</div>
      <div id="members" style="margin-top:6px"></div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <div style="font-size:14px;font-weight:600">운영진 코드 변경</div>
        <div class="muted">새 운영진은 내 정보에서 이 코드를 입력해 인증합니다. 6자 이상.</div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="fNewCode" placeholder="새 운영진 코드" autocomplete="off">
          <button class="ghost" style="white-space:nowrap" onclick="changeAdminCode()">변경</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div><strong style="font-size:14px">앱을 열 때 첫 화면</strong></div>
        <div class="seg" id="startSeg">
          <button data-v="home" onclick="setStartView('home')">홈</button>
          <button data-v="calendar" onclick="setStartView('calendar')">달력</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 달력 화면 -->
  <section id="viewCalendar">
    <div class="card">
      <div class="cal-head">
        <button class="icon" onclick="moveMonth(-1)">&lsaquo;</button>
        <strong id="monthLabel"></strong>
        <button class="icon" onclick="moveMonth(1)">&rsaquo;</button>
      </div>
      <div class="cal" id="calGrid"></div>
      <div class="row" style="margin-top:10px">
        <span class="muted"><span class="badge regular">정기</span><span class="badge flash">번개</span></span>
        <button class="ghost" onclick="goToday()">오늘</button>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <strong id="dayLabel"></strong>
        <button class="primary" onclick="openCreate()">+ 모임 만들기</button>
      </div>
      <div id="dayList"></div>
    </div>
  </section>

  <!-- 모임 상세 화면 -->
  <section id="viewDetail" class="hidden">
    <button class="ghost" onclick="showView(state.prevView)" style="margin-bottom:10px">&lsaquo; 뒤로</button>
    <div class="card" id="detailInfo"></div>
    <div class="card">
      <strong>참가자 <span id="pCount" class="muted"></span></strong>
      <div class="people" id="people"></div>
      <button class="primary" id="joinBtn" style="width:100%;margin-top:4px" onclick="toggleJoin()">참가</button>
    </div>
    <div class="card">
      <div class="row"><strong>대진표</strong>
        <div style="display:flex;gap:6px;align-items:center">
          <select id="rounds" style="width:auto">
            <option value="1">1라운드</option><option value="2">2라운드</option><option value="3" selected>3라운드</option>
            <option value="4">4라운드</option><option value="5">5라운드</option><option value="6">6라운드</option>
          </select>
          <button class="ghost" id="genBtn" onclick="generateBracket()">대진 생성</button>
        </div>
      </div>
      <p class="muted" id="bracketHint"></p>
      <div id="bracket"></div>
      <div id="standings"></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-bottom:30px">
      <button class="danger" id="deleteBtn" onclick="deleteMeetup()">모임 삭제</button>
    </div>
  </section>
</main>

<!-- 모임 생성 -->
<div class="modal" id="createModal" onclick="if(event.target===this)closeCreate()">
  <div class="sheet">
    <div class="row"><strong>모임 만들기</strong><button class="icon" onclick="closeCreate()">&times;</button></div>
    <label>종류</label>
    <select id="fKind"><option value="flash">번개</option><option value="regular">정기 모임</option></select>
    <label>제목</label>
    <input id="fTitle" placeholder="예: 토요일 아침 번개">
    <div class="two">
      <div><label>날짜</label><input id="fDate" type="date"></div>
      <div><label>시작 시간</label><input id="fTime" type="time" value="10:00"></div>
    </div>
    <label>장소</label>
    <input id="fLocation" placeholder="예: OO테니스장 3번 코트">
    <div class="two">
      <div><label>코트 수</label><input id="fCourts" type="number" min="1" value="1"></div>
      <div><label>정원</label><input id="fCapacity" type="number" min="2" value="8"></div>
    </div>
    <label>메모</label>
    <textarea id="fNote" placeholder="회비, 준비물 등"></textarea>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button class="ghost" onclick="closeCreate()">취소</button>
      <button class="primary" onclick="submitCreate()">만들기</button>
    </div>
  </div>
</div>

<!-- 로그인 -->
<div class="modal" id="loginModal" onclick="if(event.target===this)closeLogin()">
  <div class="sheet" style="text-align:center">
    <img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:50%">
    <div style="font-weight:700;font-size:17px;margin-top:8px">로그인이 필요합니다</div>
    <p class="muted" style="margin:6px 0 0">모임 만들기와 참가 신청은 로그인 후 이용할 수 있습니다.<br>모임 일정은 로그인 없이도 볼 수 있습니다.</p>
    <button class="kakao" onclick="loginKakao()">카카오로 로그인</button>
    <div style="margin-top:10px"><button class="ghost" onclick="closeLogin()">나중에</button></div>
  </div>
</div>

<!-- 내 정보 -->
<div class="modal" id="profileModal" onclick="if(event.target===this)closeProfile()">
  <div class="sheet">
    <div class="row"><strong>내 정보</strong><button class="icon" onclick="closeProfile()">&times;</button></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
      <img id="pAvatar" class="avatar-lg" src="" alt="" onerror="this.style.visibility='hidden'">
      <div><div id="pName" style="font-weight:700;font-size:16px"></div><div id="pRole" class="muted"></div></div>
    </div>
    <label>표시 이름</label>
    <input id="fName" maxlength="20" placeholder="모임에서 쓸 이름" onkeydown="if(event.key==='Enter')saveProfile()">
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:space-between">
      <button class="danger" onclick="logout()">로그아웃</button>
      <button class="primary" onclick="saveProfile()">저장</button>
    </div>
    <div id="claimBox" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
      <strong style="font-size:14px">운영진 인증</strong>
      <div class="muted">운영진에게 받은 코드를 입력하면 운영진 권한이 생깁니다.</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="fAdminCode" placeholder="운영진 코드" autocomplete="off" onkeydown="if(event.key==='Enter')claimAdmin()">
        <button class="ghost" style="white-space:nowrap" onclick="claimAdmin()">인증</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== 설정 =====
const CLUB_NAME    = 'BY 테니스 클럽';
const SUPABASE_URL = 'https://wzjoiitmujirjtliwwjg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_aopxcBhoftCxz9Q73zX9og_XKtwDJ-3';
// ===============

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
document.getElementById('clubName').textContent = CLUB_NAME;
document.title = CLUB_NAME;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = ymd(new Date());
const DOW = ['일','월','화','수','목','금','토'];

const state = {
  year: new Date().getFullYear(),
  month: new Date().getMonth(),   // 0-based
  selected: todayStr,
  meetups: [],                    // 이번 달 모임
  current: null,                  // 상세 보고 있는 모임
  view: 'home', prevView: 'home',  // 현재 화면, 상세에서 돌아갈 화면
  user: null                      // 로그인한 회원 프로필 {id, name, avatar_url, role}
};

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function showError(e){
  console.error(e);
  const msg = (e && e.message) || String(e);
  if (/schema cache|does not exist|relation/.test(msg)) {
    $('banner').innerHTML = '데이터베이스 준비가 안 됐습니다. Supabase → SQL Editor 에서 <code>schema.sql</code> 과 <code>schema2_auth.sql</code> 을 실행해 주세요.';
    $('banner').classList.remove('hidden');
  } else if (/row-level security|violates|permission denied|JWT/.test(msg)) {
    toast(state.user ? '권한이 없습니다' : '로그인이 필요합니다');
  } else toast('오류: ' + msg);
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(s){ const [y,m,d]=s.split('-'); const dt=new Date(+y,m-1,+d); return `${+m}월 ${+d}일 (${DOW[dt.getDay()]})`; }
function fmtTime(t){ return t ? t.slice(0,5) : ''; }

// ===== 로그인 / 회원 =====
const isAdmin   = () => !!state.user && state.user.role === 'admin';
const canManage = m  => !!state.user && (isAdmin() || m.created_by_id === state.user.id);   // 운영진 또는 모임 주최자
const myId      = () => state.user ? state.user.id : null;

async function initAuth(){
  const { data: { session } } = await db.auth.getSession();
  await setUser(session ? session.user : null);
  if (location.hash.includes('access_token') || location.search.includes('code=')) history.replaceState(null, '', location.pathname);
  db.auth.onAuthStateChange((event, s) => {
    const uid = s ? s.user.id : null;
    if (uid === myId()) return;                     // 같은 사용자면 무시
    setUser(s ? s.user : null).then(refreshView);
  });
}
async function setUser(u){
  if (!u){ state.user = null; renderUser(); return; }
  const { data } = await db.from('profiles').select('*').eq('id', u.id).maybeSingle();
  const meta = u.user_metadata || {};
  state.user = data || { id: u.id, role: 'member',
    name: meta.name || meta.full_name || meta.preferred_username || '회원',
    avatar_url: meta.avatar_url || meta.picture || null };
  renderUser();
}
function renderUser(){
  const u = state.user;
  $('userChip').innerHTML = u
    ? `${u.avatar_url ? `<img src="${esc(u.avatar_url)}" alt="">` : ''}<span>${esc(u.name)}</span>`
    : '<span>카카오 로그인</span>';
}
function refreshView(){
  if (state.view === 'detail' && state.current) openDetail(state.current.id);
  else showView(state.view);
}
let afterLogin = null;
function requireLogin(next){
  if (state.user) return true;
  afterLogin = next || null;
  $('loginModal').classList.add('open');
  return false;
}
function closeLogin(){ $('loginModal').classList.remove('open'); afterLogin = null; }
async function loginKakao(){
  const { error } = await db.auth.signInWithOAuth({ provider: 'kakao', options: { redirectTo: location.origin + location.pathname } });
  if (error) showError(error);
}
async function logout(){
  closeProfile();
  const { error } = await db.auth.signOut();
  if (error) return showError(error);
  toast('로그아웃했습니다');
}
function openProfile(){
  if (!requireLogin()) return;
  const u = state.user;
  $('pAvatar').src = u.avatar_url || ''; $('pAvatar').style.visibility = u.avatar_url ? 'visible' : 'hidden';
  $('pName').textContent = u.name;
  $('pRole').textContent = isAdmin() ? '운영진' : '회원';
  $('fName').value = u.name; $('fAdminCode').value = '';
  $('claimBox').classList.toggle('hidden', isAdmin());
  $('profileModal').classList.add('open');
}
async function claimAdmin(){
  const code = $('fAdminCode').value.trim();
  if (!code) return toast('코드를 입력하세요');
  const { data, error } = await db.rpc('claim_admin', { code });
  if (error) return showError(error);
  if (!data) return toast('코드가 맞지 않습니다');
  state.user.role = 'admin'; closeProfile(); toast('운영진이 되었습니다'); refreshView();
}
async function changeAdminCode(){
  const c = $('fNewCode').value.trim();
  if (c.length < 6) return toast('6자 이상 입력하세요');
  const { error } = await db.rpc('set_admin_code', { new_code: c });
  if (error) return showError(error);
  $('fNewCode').value = ''; toast('운영진 코드를 바꿨습니다');
}
function closeProfile(){ $('profileModal').classList.remove('open'); }
async function saveProfile(){
  const n = $('fName').value.trim();
  if (!n) return toast('이름을 입력하세요');
  const { error } = await db.from('profiles').update({ name: n }).eq('id', myId());
  if (error) return showError(error);
  state.user.name = n; renderUser(); closeProfile(); toast('저장했습니다'); refreshView();
}
async function loadMembers(){
  const { data, error } = await db.from('profiles').select('*').order('created_at');
  if (error) return showError(error);
  $('members').innerHTML = data.map(p => `
    <div class="member">
      ${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : '<img alt="">'}
      <div class="nm">${esc(p.name)}${p.role==='admin' ? '<span class="adminBadge">운영진</span>' : ''}</div>
      ${p.id === myId() ? '<span class="muted">나</span>' :
        `<button class="ghost" style="min-height:32px;padding:4px 10px" onclick="setRole('${p.id}','${p.role==='admin'?'member':'admin'}')">${p.role==='admin'?'운영진 해제':'운영진 지정'}</button>`}
    </div>`).join('') || '<p class="muted">회원이 없습니다.</p>';

async function setRole(id, role){

async function loadMonth(){
  const first = new Date(state.year, state.month, 1);
  const last  = new Date(state.year, state.month+1, 0);
  const { data, error } = await db.from('meetups')
    .select('*, participants(count)')
    .gte('date', ymd(first)).lte('date', ymd(last))
    .order('date').order('start_time');
  if (error) showError(error); else $('banner').classList.add('hidden');
  state.meetups = data || [];
  renderCalendar(); renderDayList();
}
function moveMonth(d){ const m = new Date(state.year, state.month + d, 1); state.year = m.getFullYear(); state.month = m.getMonth(); loadMonth(); }
function goToday(){ const t=new Date(); state.year=t.getFullYear(); state.month=t.getMonth(); state.selected=todayStr; loadMonth(); }

function renderCalendar(){
  $('monthLabel').textContent = `${state.year}년 ${state.month+1}월`;
  const grid = $('calGrid'); grid.innerHTML = '';
  DOW.forEach(d => { const e=document.createElement('div'); e.className='dow'; e.textContent=d; grid.appendChild(e); });
  const first = new Date(state.year, state.month, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const last = new Date(state.year, state.month+1, 0);
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  for (let i=0; i<weeks*7; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const s = ymd(d);
    const cell = document.createElement('div');
    cell.className = 'day' + (d.getMonth()!==state.month?' other':'') + (s===todayStr?' today':'') + (s===state.selected?' selected':'');
    const n = document.createElement('div');
    n.className = 'n' + (d.getDay()===0?' sun':d.getDay()===6?' sat':'');
    n.textContent = d.getDate(); cell.appendChild(n);
    state.meetups.filter(m=>m.date===s).slice(0,3).forEach(m=>{
      const t=document.createElement('div'); t.className='tag '+m.kind; t.textContent=m.title; cell.appendChild(t);
    });
    cell.onclick = () => {
      state.selected = s;
      if (d.getMonth()!==state.month){ state.year=d.getFullYear(); state.month=d.getMonth(); loadMonth(); }
      else { renderCalendar(); renderDayList(); }
    };
    grid.appendChild(cell);
  }
}

function renderDayList(){
  $('dayLabel').textContent = fmtDate(state.selected);
  const list = state.meetups.filter(m=>m.date===state.selected);
  const box = $('dayList');
  if (!list.length){ box.innerHTML = '<p class="muted">이 날은 모임이 없습니다.</p>'; return; }
  box.innerHTML = list.map(m => `
    <div class="item" onclick="openDetail('${m.id}')">
      <div class="title"><span class="badge ${m.kind}">${m.kind==='regular'?'정기':'번개'}</span>${esc(m.title)}</div>
      <div class="muted">${fmtTime(m.start_time)} · ${esc(m.location||'장소 미정')} · ${m.participants?.[0]?.count||0}/${m.capacity}명</div>
    </div>`).join('');
}

async function submitCreate(){
  const row = {
    kind: $('fKind').value, title: $('fTitle').value.trim(), date: $('fDate').value,
    start_time: $('fTime').value || null, location: $('fLocation').value.trim() || null,
    courts: +$('fCourts').value || 1, capacity: +$('fCapacity').value || 8,
    note: $('fNote').value.trim() || null, created_by: state.user.name, created_by_id: myId()
  };
  if (!row.title || !row.date) return toast('제목과 날짜를 입력하세요');
  const { data, error } = await db.from('meetups').insert(row).select().single();
  if (error) return showError(error);
  await db.from('participants').insert({ meetup_id: data.id, user_id: myId(), name: state.user.name }); // 만든 사람 자동 참가
  closeCreate(); $('fTitle').value=''; $('fLocation').value=''; $('fNote').value='';

  const [y,m] = row.date.split('-'); state.year=+y; state.month=m-1;

  if (state.view === 'home') loadHome(); else showView('calendar');
}

function showView(name){
  state.current = null;
  state.view = name;
  if (name !== 'detail') state.prevView = name;
  ['home','calendar','detail'].forEach(v => $('view'+v[0].toUpperCase()+v.slice(1)).classList.toggle('hidden', v!==name));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view===name));
  window.scrollTo(0,0);
  if (name==='home') loadHome();
  if (name==='calendar') loadMonth();
}

  document.querySelectorAll('#startSeg button').forEach(b => b.classList.toggle('active', b.dataset.v===v));
  toast(v==='home' ? '앞으로 홈이 먼저 열립니다' : '앞으로 달력이 먼저 열립니다');

  const [up, past, month] = await Promise.all([
    db.from('meetups').select('*, participants(name,user_id)').gte('date', todayStr).lte('date', ymd(in14)).order('date').order('start_time'),
    db.from('meetups').select('*, participants(count)').lt('date', todayStr).order('date', {ascending:false}).limit(3),
    db.from('meetups').select('id', {count:'exact', head:true}).gte('date', ymd(mFirst)).lte('date', ymd(mLast))

    <div class="tile"><b>${month.count ?? 0}</b><span>이번 달 모임</span></div>

      <div class="muted">${fmtDate(m.date)} · ${esc(m.location||'')} · ${m.participants?.[0]?.count||0}명 참가</div>
    </div>`).join('') : '<p class="muted">아직 지난 모임이 없습니다.</p>';

// ===== 대진 =====
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pairKey = (a,b) => [a,b].sort().join('|');

async function generateBracket(){
  const m = state.current;
  const players = m.participants.map(p=>p.name);
  if (players.length < 4) return;
  if (m.matches.length && !confirm('기존 대진표를 지우고 새로 만들까요?')) return;
  const rounds = +$('rounds').value;
  const courts = Math.max(1, Math.min(m.courts, Math.floor(players.length/4)));
  const played = Object.fromEntries(players.map(p=>[p,0]));
  const partnered = {};   // 같은 파트너 반복 줄이기용 카운트
  const rows = [];
  for (let r=1; r<=rounds; r++){
    // 적게 뛴 사람 우선, 동률은 랜덤
    const order = shuffle(players.slice()).sort((a,b)=>played[a]-played[b]);
    const playing = order.slice(0, courts*4);
    for (let c=0; c<courts; c++){
      const four = playing.slice(c*4, c*4+4);
      // 세 가지 팀 분할 중 파트너 반복이 가장 적은 것 선택
      const splits = shuffle([[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]]);
      let best=splits[0], bestScore=Infinity;
      splits.forEach(s=>{
        const sc = (partnered[pairKey(four[s[0][0]],four[s[0][1]])]||0) + (partnered[pairKey(four[s[1][0]],four[s[1][1]])]||0);
        if (sc<bestScore){ bestScore=sc; best=s; }
      });
      const ta=[four[best[0][0]],four[best[0][1]]], tb=[four[best[1][0]],four[best[1][1]]];
      partnered[pairKey(...ta)] = (partnered[pairKey(...ta)]||0)+1;
      partnered[pairKey(...tb)] = (partnered[pairKey(...tb)]||0)+1;
      four.forEach(p=>played[p]++);
      rows.push({ meetup_id: m.id, round: r, court: c+1, team_a: ta, team_b: tb });
    }
  }
  let res = await db.from('matches').delete().eq('meetup_id', m.id);
  if (res.error) return showError(res.error);
  res = await db.from('matches').insert(rows);
  if (res.error) return showError(res.error);
  toast('대진표를 만들었습니다'); openDetail(m.id);
}

function renderBracket(){
  const m = state.current;
  const box = $('bracket'); box.innerHTML = '';
  if (!m.matches.length){ $('standings').innerHTML=''; return; }
  const players = m.participants.map(p=>p.name);
  const dis = canManage(m) ? '' : 'disabled';
  const rounds = [...new Set(m.matches.map(x=>x.round))];
  rounds.forEach(r=>{
    const ms = m.matches.filter(x=>x.round===r);
    const playing = new Set(ms.flatMap(x=>[...x.team_a,...x.team_b]));
    const rest = players.filter(p=>!playing.has(p));
    const div = document.createElement('div'); div.className='round';
    div.innerHTML = `<h4>${r}라운드</h4>` + ms.map(x=>`
      <div class="match ${x.score_a!=null&&x.score_b!=null?'done':''}">
        <div class="team">${x.team_a.map(esc).join(' · ')}</div>
        <div class="score">
          <input type="number" min="0" value="${x.score_a??''}" ${dis} onchange="saveScore('${x.id}','score_a',this.value)">
          <span>:</span>
          <input type="number" min="0" value="${x.score_b??''}" ${dis} onchange="saveScore('${x.id}','score_b',this.value)">
        </div>
        <div class="team">${x.team_b.map(esc).join(' · ')}</div>
        <div class="muted" style="grid-column:1/-1;text-align:center;font-size:11px">${x.court}번 코트</div>
      </div>`).join('') + (rest.length?`<div class="rest">휴식: ${rest.map(esc).join(', ')}</div>`:'');
    box.appendChild(div);
  });
  renderStandings();
}
async function saveScore(id, field, val){
  const v = val==='' ? null : +val;
  const { error } = await db.from('matches').update({ [field]: v }).eq('id', id);
  if (error) return showError(error);
  const mt = state.current.matches.find(x=>x.id===id); mt[field]=v;
  renderBracket();
}
function renderStandings(){
  const m = state.current;
  const st = {};
  const get = p => st[p] || (st[p] = {w:0,l:0,gf:0,ga:0});
  m.matches.filter(x=>x.score_a!=null&&x.score_b!=null).forEach(x=>{
    const aw = x.score_a>x.score_b, bw = x.score_b>x.score_a;
    x.team_a.forEach(p=>{ const s=get(p); s.gf+=x.score_a; s.ga+=x.score_b; if(aw)s.w++; if(bw)s.l++; });
    x.team_b.forEach(p=>{ const s=get(p); s.gf+=x.score_b; s.ga+=x.score_a; if(bw)s.w++; if(aw)s.l++; });
  });
  const rows = Object.entries(st).sort((a,b)=>b[1].w-a[1].w || (b[1].gf-b[1].ga)-(a[1].gf-a[1].ga));
  $('standings').innerHTML = rows.length ? `<h4 style="margin:14px 0 6px">결과</h4>
    <table class="st">
      <tr class="muted"><th>이름</th><th>승</th><th>패</th><th>득실</th></tr>
      ${rows.map(([n,s])=>{ const d=s.gf-s.ga; return `<tr><td>${esc(n)}</td><td>${s.w}</td><td>${s.l}</td><td>${d>0?'+':''}${d}</td></tr>`; }).join('')}
    </table>` : '';
}

// ===== 시작 =====
initAuth().then(() => showView(localStorage.getItem('startView') || 'home'));
</script>
</body>
</html>
